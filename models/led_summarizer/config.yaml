credentials:
  hf_token: ""

dataset:
  csv_path:      "data_summarization.csv"  
  article_col:   "lesson_text"             
  summary_col:   "summary"                  
  test_size:     200                       
  val_ratio:     0.1                        
  seed:          42

model:
  checkpoint: "allenai/led-base-16384"
  max_input_length:  1024
  max_target_length: 256

training:
  epochs:                    8
  per_device_train_batch:    2
  per_device_eval_batch:     4
  gradient_accum_steps:      8
  gradient_checkpointing:    true
  warmup_steps:              100
  learning_rate:             3.0e-5
  weight_decay:              0.01
  logging_steps:             5
  save_total_limit:          3
  generation_max_length:     256
  seed:                      42
  fp16:                      false

inference:
  num_beams:    4
  max_length:   500
  output_dir:   "./outputs/inference"

output:
  dir:          "/vol/led-summarizer-output" 
  local_dir:    "./outputs/model"            
  logging_dir:  "/vol/logs"

hub:
  push_to_hub:    false
  repo_id:        "SeifElden2342532/children_educational_summarizer"
  private:        false
  commit_message: "Upload fine-tuned LED summarizer"

modal:
  volume_name:    "led-summarizer-vol"
  gpu:            "H100"
  timeout:        86400       
  python_version: "3.11"
  torch_version:  "2.5.1"
  cuda_version:   "cu124"
