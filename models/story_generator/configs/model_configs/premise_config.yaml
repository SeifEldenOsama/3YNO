defaults:
  output_path: output/premise.json
  logging_level: info
  MODEL:
    engine: mistralai/Mistral-7B-Instruct-v0.3
    tensor_parallel_size: 1
    server_type: vllm
    host: http://localhost
    port: 9741
    prompt_format: openai-chat
    temperature: 1.2
    top_p: 0.99
    frequency_penalty: 0
    presence_penalty: 0
    TITLE:
      max_tokens: 64
      stop: []
    PREMISE:
      max_tokens: 200
      stop: ["\n"]
