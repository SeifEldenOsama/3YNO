model:
  engine: "mistralai/Mistral-7B-Instruct-v0.3"
  host: "http://localhost"
  port: 8000
  server_type: vllm
  tensor_parallel_size: 1

  story:
    write:
      max_tokens: 350
      temperature: 0.7
      top_p: 0.9
      prompt_format: openai-chat
    score:
      max_tokens: 20
      temperature: 0.1
      top_p: 0.5
      prompt_format: openai-chat
    summarize:
      max_tokens: 80
      temperature: 0.3
      top_p: 0.9
      prompt_format: openai-chat

output_path: "outputs/story.json"
